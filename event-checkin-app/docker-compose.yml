services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./server/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
volumes:
  pgdata:
